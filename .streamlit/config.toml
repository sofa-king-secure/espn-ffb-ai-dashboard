[server]
# Local only: the dashboard holds live ESPN cookies and AI keys.
address = "127.0.0.1"
port = 8501
headless = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[theme]
base = "light"
primaryColor = "#CC0000"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F6"
textColor = "#121213"
linkColor = "#0063C6"
font = "Helvetica Neue, Helvetica, Arial, sans-serif"
headingFont = "Helvetica Neue, Helvetica, Arial, sans-serif"
headingFontWeights = [800, 800, 700, 700, 700, 700]
baseRadius = "6px"
borderColor = "#DCDDDF"
dataframeHeaderBackgroundColor = "#F4F5F6"
showSidebarBorder = false

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F6"
